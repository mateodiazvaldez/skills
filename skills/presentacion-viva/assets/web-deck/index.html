<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación</title>
<!-- <link rel="icon" href="assets/ISOTIPO.svg"> -->
<link rel="stylesheet" href="player.css">
</head>
<body>
<div id="stage"></div>
<div id="progress"><i></i></div>
<nav id="ctrl" aria-label="Control de la presentación">
  <button id="c-prev" title="Anterior (←)" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="c-pos" title="Índice (G)" aria-label="Índice de slides">1 / 1</button>
  <button id="c-next" title="Siguiente (→)" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <span class="sep"></span>
  <button id="c-index" title="Índice (G)" aria-label="Índice"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <button id="c-notes" title="Ventana de presentador (P)" aria-label="Ventana de presentador"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
  <button id="c-full" title="Pantalla completa (F)" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
</nav>
<div id="index" hidden>
  <div id="i-head"><b>Slides</b><button id="i-close" aria-label="Cerrar índice"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <ol id="i-list"></ol>
</div>
<div id="presenter" hidden>
  <div id="p-head"><span id="p-pos"></span><span id="p-timer">00:00</span></div>
  <div id="p-notes"></div>
  <div id="p-next"></div>
  <div id="p-nav"><button id="p-prev">‹ Anterior</button><button id="p-next-btn">Siguiente ›</button></div>
  <p id="p-help">← → navegar · R reiniciar reloj</p>
</div>
<script src="player.js"></script>
</body>
</html>
